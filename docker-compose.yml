services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jules
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ambucluster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically initialize database with schema and seed files
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_USER: jules
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ambucluster
    depends_on:
      - db
    command: npm start

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
